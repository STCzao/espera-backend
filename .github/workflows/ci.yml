name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Same versions as docker-compose.yml. POSTGRES_DB/credentials match the
    # defaults tests/setup and src/scripts/setup-test-db.ts fall back to, so no
    # extra env wiring is needed for the integration suite.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: espera_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall runs `prisma generate`.
      - run: npm ci

      - name: Typecheck (src)
        run: npm run typecheck

      - name: Typecheck (tests)
        run: npm run typecheck:test

      - name: Lint
        run: npm run lint

      - name: Unit and API tests
        run: npm run test:run

      - name: Build (compile + resolve path aliases)
        run: npm run build

      - name: Integration tests (real Postgres and Redis)
        run: |
          npm run test:integration:setup
          npm run test:integration

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Blocks on critical advisories in production dependencies. High ones are
      # printed by the next step without failing the build: today's only one is
      # a transitive of the Prisma CLI (deepmerge-ts), reviewed and accepted —
      # see docs/plan-hallazgos-revision-3.md, A2.
      - run: npm audit --omit=dev --audit-level=critical
      - name: Report remaining advisories
        run: npm audit --omit=dev || true

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t espera-backend:ci .
